<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="bilzet-build" content="v10-admin-isolated"><title>BILZET Admin</title><style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--ok:#16a34a;--shadow:0 12px 40px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#0f172a;color:#fff;padding:22px 16px}.brand{font-size:23px;font-weight:950;letter-spacing:.08em;margin-bottom:24px}.nav{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0;font-weight:800;cursor:pointer}.nav.active,.nav:hover{background:#1e293b;color:#fff}.main{min-width:0}.top{height:72px;display:flex;align-items:center;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.content{padding:24px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{font-size:28px;font-weight:950}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px}.right{margin-left:auto}.input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid #d7dce3;border-radius:10px;background:#fff}.textarea{min-height:90px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer;background:#eef2ff;color:#1e3a8a}.btn.primary{background:#2563eb;color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn.ok{background:#dcfce7;color:#166534}.btn.ghost{background:#fff;border:1px solid var(--line);color:#334155}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:850;background:#f1f5f9}.badge.ok{background:#dcfce7;color:#166534}.badge.danger{background:#fee2e2;color:#991b1b}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{background:#f8fafc}.section{display:none}.section.active{display:block}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#0f172a,#1e3a8a)}.login-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.25)}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(720px,100%);background:#fff;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static}.grid4,.grid3,.grid2{grid-template-columns:1fr}.top{position:static}.content{padding:14px}}
</style></head><body><div id="loginView" class="login"><form id="adminLogin" class="login-card"><div class="brand" style="color:#0f172a">BILZET ADMIN</div><p class="muted small">Private administration portal. This page is never linked or opened by the user portal.</p><label>Admin ID</label><input id="email" class="input" type="email" autocomplete="username" required><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password" required><button class="btn primary" style="width:100%;margin-top:16px">Secure Login</button><div id="loginMsg" class="small muted" style="margin-top:12px"></div></form></div><div id="app" class="shell hidden"><aside class="side"><div class="brand">BILZET</div><button class="nav active" data-page="overview">Overview</button><button class="nav" data-page="users">Users</button><button class="nav" data-page="plans">Plans</button><button class="nav" data-page="tickets">Support Queries</button><button class="nav" id="logout">Logout</button></aside><main class="main"><header class="top"><div><b>BILZET Administration</b><div class="small muted">Garden Greens Private Limited</div></div><span class="badge right">Private</span></header><div class="content"><section id="overview" class="section active"></section><section id="users" class="section"></section><section id="plans" class="section"></section><section id="tickets" class="section"></section></div></main></div><div id="modalRoot"></div><script src="/assets/admin.js"></script></body></html>
